name: Android

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      # Opcional: pega el contenido de google-services.json en un secreto con este nombre
      # (Settings → Secrets and variables → Actions) y los APK saldrán ya conectados a Firebase.
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: google-services.json
        if: env.GOOGLE_SERVICES_JSON != ''
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Tests y APK de cliente y maestra
        run: ./gradlew --no-daemon :core:test :app:assembleClienteDebug :app:assembleMaestraDebug

      - uses: actions/upload-artifact@v4
        with:
          name: catanna-apks
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
